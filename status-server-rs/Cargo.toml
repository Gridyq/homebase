[package]
name = "homebase-status"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
flate2 = "1.1.10"
form_urlencoded = "1.2.2"
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
inotify = "0.11.5"
libc = "0.2.191"
md-5 = "0.11.0"
regex = "1.13.1"
ring = "0.17.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "process", "time", "signal", "sync", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
unicode-normalization = "0.1.26"
url = "2.5.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }
