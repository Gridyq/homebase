# Builds an unsigned .ipa for SideStore to sign with a free Apple ID.
#
# - Run it from the Actions tab ("Run workflow") and pick a configuration:
#     Release: standalone app, JavaScript bundled in.
#     Debug:   development build that loads code live from `npx expo start` on your computer.
#   The result is published to the rolling release `latest-release` or `latest-debug`.
# - Pushing a tag like `v1.2.0` builds Release and publishes a release for that tag.
name: Build iOS

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        type: choice
        options: [Release, Debug]
        default: Release
  push:
    tags: ['v*']

# The build runs npm install scripts and Expo's prebuild, so it only gets to read the repo; the
# release job, which runs none of that, is the one that can write.
permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}-${{ inputs.configuration || 'Release' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
      APP_NAME: Homebase
    outputs:
      ipa: ${{ steps.package.outputs.ipa }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Third-party, so pinned to a commit (v1.7.0) rather than a tag its owner could move.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -workspace "ios/$APP_NAME.xcworkspace" \
            -scheme "$APP_NAME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        id: package
        run: |
          IPA="$APP_NAME-$CONFIGURATION.ipa"
          mkdir Payload
          cp -R "build/Build/Products/$CONFIGURATION-iphoneos/$APP_NAME.app" Payload/
          zip -qry "$IPA" Payload
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ipa }}
          path: ${{ steps.package.outputs.ipa }}
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
      APP_NAME: Homebase
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.ipa }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IPA: ${{ needs.build.outputs.ipa }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            gh release create "$GITHUB_REF_NAME" "$IPA" --title "$APP_NAME $GITHUB_REF_NAME" --generate-notes
          else
            TAG="latest-$(echo "$CONFIGURATION" | tr '[:upper:]' '[:lower:]')"
            gh release delete "$TAG" --yes --cleanup-tag || true
            gh release create "$TAG" "$IPA" --prerelease --target "$GITHUB_SHA" \
              --title "$APP_NAME $CONFIGURATION (latest)" \
              --notes "Built from ${GITHUB_SHA::7}. Download the .ipa on your iPhone and open it with SideStore."
          fi
